on:
  push: # Se ejecuta cuando hay un push en el repositorio
    branches:
      - main
  pull_request: # Se ejecuta en los PR a la rama main
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # Checkout main branch with github task
      - name: "Checkout main"
        uses: actions/checkout@v3
      # Install doctl
      - name: "Install doctl"
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      # Declara la variable TAG
      - name: "Set TAG variable"
        run: echo "TAG=$(echo $GITHUB_SHA | head -c7)" >> $GITHUB_ENV
      # Verifica que exista el secret del formulario de /lead antes de construir
      - name: "Verify LEAD_API_KEY secret"
        env:
          LEAD_API_KEY: ${{ secrets.LEAD_API_KEY }}
        run: |
          if [ -z "$LEAD_API_KEY" ]; then
            echo "::error::Falta el secret LEAD_API_KEY del repositorio; el formulario de /lead quedaría inoperativo."
            exit 1
          fi
      # Construir la imagen
      - name: "Build container image"
        env:
          PUBLIC_LEAD_API_KEY: ${{ secrets.LEAD_API_KEY }}
        run: docker build -f dockerfile.prod --build-arg PUBLIC_LEAD_API_KEY="$PUBLIC_LEAD_API_KEY" -t registry.digitalocean.com/munyaal-docr/enlaces/website:${{ env.TAG }} .
      # Log In to Registry
      - name: "Log in to DigitalOcean Container Registry with short-lived credentials"
        run: doctl registry login --expiry-seconds 1200
      # Subir imagen al registry
      - name: "Push image to DigitalOcean Container Registry"
        run: docker push registry.digitalocean.com/munyaal-docr/enlaces/website:${{ env.TAG }}
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    strategy:
      matrix:
        workspace:
          - namespace: enlaces
            deploy: website
            container: website
    steps:
      # Checkout main branch with github task
      - name: "Checkout main"
        uses: actions/checkout@v3
      # Install doctl
      - name: "Install doctl"
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      # Declara la variable TAG
      - name: "Set TAG variable"
        run: echo "TAG=$(echo $GITHUB_SHA | head -c7)" >> $GITHUB_ENV
      # Log In to Kubernetes Cluster
      - name: "Save DigitalOcean kubeconfig with short-lived credentials"
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 kube
      # Se asigna una nueva imagen
      - name: "Set new image in deployment"
        run: kubectl set image deployment/${{ matrix.workspace.deploy }} ${{ matrix.workspace.container }}=registry.digitalocean.com/munyaal-docr/enlaces/website:${{ env.TAG }} -n ${{ matrix.workspace.namespace }}
      # Create patch file
      - name: "Create patch file"
        run: |
          echo "
          metadata:
            labels:
              app.kubernetes.io/version: '${{ env.TAG }}'
          spec:
            template:
              metadata:
                labels:
                  app.kubernetes.io/version: '${{ env.TAG }}'
          " > patch.yaml
      # Apply patch file
      - name: "Apply version label patch"
        run: kubectl patch deployment/${{ matrix.workspace.deploy }} -n ${{ matrix.workspace.namespace }} --patch-file patch.yaml
      # Verify deployment
      - name: Verify deployment
        run: kubectl rollout status deployment/${{ matrix.workspace.deploy }} -n ${{ matrix.workspace.namespace }}
